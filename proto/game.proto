syntax = "proto3";

package game;

// things we thought about

message ViewAngle {
  float pitch = 1;
  float yaw = 2;
  float roll = 3;
}
// Client -> Server: every input the client has not seen acknowledged, oldest
// first. This is the ONLY input message on the wire; a single input is a batch
// of one.
//
// Redundancy instead of retransmission. These are the client's half of a
// prediction the server re-runs, so a lost datagram is a lost tick of input --
// the player pressed forward and the world disagrees. Re-sending the unacked
// tail in every datagram costs a few dozen bytes and needs no timers, no acks
// per input and no state on either side, because the pieces were already
// here: S2C_EntityPackage.latest_processed_input_number is a HIGH-WATER mark, and
// the server already drops anything at or below it. A duplicate is therefore
// free by construction rather than by agreement.
//
// It also converts the move budget's failure mode: an input dropped for want
// of a credit (server/move_budget.hpp) is still unacked, so it arrives again
// next tick and runs when the credit does. The budget throttles rather than
// discards, with the queue living on the client where the data already was.
message C2S_ClientInputBatch {
  repeated C2S_ClientInput inputs = 1;
}

// One button transition inside the tick a C2S_ClientInput covers: WHEN it
// happened, and the whole bitfield in effect from that moment on.
//
// A slot INDEX, not a fraction: 64 slots per tick, so 0.26ms at 60Hz. The client
// predicts and the server re-simulates, and those two runs must agree exactly --
// a float differing by one ULP feeds a dt that feeds a clamp, and diverges the
// prediction. A 6-bit integer cannot disagree with itself. See
// shared/subtick.hpp for the grammar and subtick_plan.md for why sub-tick at
// all.
message C2S_SubtickEdge {
  optional uint32 slot = 1;          // 1..63, strictly ascending across edges
  optional uint64 buttons_after = 2; // the FULL bitfield, not a delta

  // Where the player was AIMING from this slot onward. Sampled at the edge
  // rather than given edges of its own: the angle is continuous, a 1000Hz mouse
  // would spend the whole MAX_SUBTICK_EDGES budget on motion, and an edge costs
  // a full pmove pass on the server. The moments that already exist are the
  // ones that matter -- the trigger edge IS the moment a shot is aimed.
  //
  // Absent means "unchanged from the previous edge", which is what a client
  // with no per-edge aim to report sends. That degrades exactly to the old
  // behaviour: every step runs under viewangles_at_start.
  optional ViewAngle view_after = 3;
}

// ONE TICK OF A CLIENT'S INPUT, PLUS WHAT THAT CLIENT WAS SEEING WHEN IT MADE
// IT. Every word of the old name (C2S_PlayerMoveCommand) was wrong, which is
// why it is worth spelling out what this actually is:
//
//   not "Move"    -- forwardmove/sidemove/upmove are gone (reserved below).
//                    Movement travels as buttons_bitfield + subtick_edges, and
//                    those also carry FIRE, which is a shot, not a move.
//   not "Player"  -- a SPECTATOR has no player entity and still sends these;
//                    the server has a branch for exactly that. A client sends
//                    this. See CLAUDE.md, "Client vs Player".
//   not "Command" -- C2S_Command, a console line, is a different message on
//                    this same socket.
//
// Roughly half of it is not input at all. `input_number` sequences, and
// `held_snapshot_tick` / `interpolated_*` are RIDERS: they describe the client,
// not the tick's input, and they hitch along because this is the only regular
// c2s traffic. Each says so at its own field.
message C2S_ClientInput {
  // Sequencing only, and the client's own counter -- unrelated to any server
  // tick. The server acks a high-water mark of it (S2C_EntityPackage), which is
  // both what trims the resend tail and where the client's reconciliation
  // replay starts.
  optional int32 input_number = 1;

  // Where the aim ENDED UP this tick. Nothing simulates under it: it is what
  // the next tick starts from and what the server writes to
  // Player_Entity::view_angle_*, so everyone else draws where this player is
  // looking now. A tick whose mouse moved and whose buttons did not has no edge
  // to hang the motion on, which is why this cannot be folded into the edges.
  optional ViewAngle viewangles = 3;

  // Where it STARTED, which is what the tick's first step runs under. Split
  // from `viewangles` when the aim became sub-tick: one angle per tick meant a
  // press timed to 0.26ms was still pointed wherever the mouse finished the
  // frame, which on a flick is the whole error sub-tick exists to delete.
  //
  // Absent falls back to `viewangles`, reproducing the single-angle tick a bot,
  // a replay or any pre-sub-tick-aim client sends.
  optional ViewAngle viewangles_at_start = 13;

  // 2 was `tick_count`, which the client set to a verbatim copy of
  // input_number and nothing ever read. 4/5/6 were forwardmove/sidemove/upmove,
  // dead since the sub-tick cutover moved movement into the buttons and their
  // edges -- they outlived their readers and only the message's NAME still
  // referred to them.
  reserved 2, 4, 5, 6;

  // The buttons at the START of this tick, and every transition that followed,
  // in order. Together they are the tick's input: the server runs one movement
  // step per interval between the edges, and the client's prediction runs the
  // identical split (shared/subtick.hpp, split_tick).
  //
  // buttons_bitfield used to be "the buttons when the command was built", which
  // quantized every press to the 16.7ms tick grid -- a modeling error, since the
  // press happened at a time and the grid is an implementation detail of the
  // simulator. It is the START state now, so a press mid-tick shows up as an
  // edge rather than as next tick's state, and the server sees the press at the
  // moment it happened rather than up to a tick late.
  //
  // No edges is a whole client, not a degenerate one: it means nothing changed
  // inside the tick, and the tick runs as the single step it always did. Bots
  // and tests never send any.
  optional uint64 buttons_bitfield = 7;
  repeated C2S_SubtickEdge subtick_edges = 12;

  // The newest snapshot this client holds a complete copy of, named by the
  // server tick it was taken at. 0 = none yet, send a full update.
  //
  // A RIDER: it describes what the client HOLDS, not the tick's input. Client
  // input is the only regular c2s traffic, so it hitches a ride rather than
  // paying for a datagram of its own. This is the ONLY thing that makes delta
  // compression correct over UDP: the server may not build a diff against what
  // it last SENT (that packet may have been dropped), only against what the
  // client says it actually HAS.
  optional uint32 held_snapshot_tick = 8;

  // A RIDER, like held_snapshot_tick above: the blend this input was aimed
  // THROUGH. Remote players are DRAWN interpolated between two snapshots
  // (play_state.cpp, "Interpolate remote players"), never at either one, so the
  // world the crosshair was on is at no whole tick.
  //
  // The server lerps these SAME two endpoints before testing a shot, rather
  // than posing the true state at the moment they work out to. After packet
  // loss the two are different places -- the client drew a chord, and the real
  // path between the endpoints may have curved off it. Reproducing the chord is
  // what makes "if it was under your crosshair, you hit it" true.
  // See shared/lag_compensation.hpp.
  //
  // Distinct from `input_number`, which stamps the same press on the client's
  // OTHER clock: prediction runs its own body AHEAD of the server while
  // rendering everyone else BEHIND it. That clock needs no compensation -- the
  // server re-derives the shooter's own position from the inputs in this very
  // message.
  //
  // Read at the moment of the SHOT when this input carries one, not at the
  // moment the input was built: the trigger goes down at a sub-tick slot
  // inside the tick (see subtick_edges above), and the world the shooter was
  // drawing then is that fraction of a tick older. With no press in the tick it
  // is the read it always was, and nothing consumes it.
  //
  // Either tick being 0 means no blend yet (spectating, or fewer than two
  // snapshots seen); the server falls back to present-tick poses.
  //
  // Deliberately NOT merged into held_snapshot_tick, even though
  // interpolated_towards_tick equals it today. They answer different questions
  // ("what did I reconstruct" vs "what did I draw"), and the equality is an
  // invariant of the client's publish path, not of this message -- it stops
  // holding the moment anything replicates at its own cadence.
  optional uint32 interpolated_from_tick    = 9;
  optional uint32 interpolated_towards_tick = 10;
  optional float  interpolation_fraction    = 11;   // 0..1, from -> towards

  // A RIDER, and the third of them: the content hash of the map this client
  // currently holds. The server compares it to its own and sets
  // client_slot_t::map_ready, which is what gates snapshots and effects.
  //
  // STATE, not an ack, and that distinction is the whole design. This replaced a
  // one-shot C2S_MapLoaded message, whose loss left map_ready false forever and
  // therefore withheld snapshots forever -- healed only by a 0.25s CmdChangeMap
  // retransmit that existed for no other reason. A value that is continuously
  // true has nothing to lose: it self-corrects on the next input, one tick
  // later, with no retransmit anywhere. State that gates behavior is replicated
  // as state, never delivered as an event -- the same rule that put round_phase
  // on S2C_EntityPackage, applied in the other direction.
  //
  // 0 means "no map", which never matches a loaded server map. A client that is
  // still downloading sends no input at all (prediction only runs Connected), so
  // the absence is not what the server is reading here.
  optional uint32 map_content_hash = 14;
}

// s2c is server to client.
message S2C_EntityPackage {
    // 1 was expected_max_entities, 3 was update_baseline. Both are gone with
    // implicit removal: the payload used to list EVERY entity every tick (so
    // "absent means gone" could express a despawn), and a receiver wanted to
    // know how many to expect. Removals are explicit records now and unchanged
    // entities are omitted, so a record count is not an entity count and the
    // one at the head of entity_data is the only count that means anything.
    // 2 was `is_delta`, a second field for the fact delta_from_tick's presence
    // already carries. Nothing ever read it, so it could disagree with the tick
    // beside it and no receiver would notice. One field, one fact.
    reserved 1, 2, 3;

    optional bytes entity_data = 4; // this is the reflective snapshot data
    optional int32 server_tick = 5;
    // How far this client's input stream has been CONSUMED -- a HIGH-WATER MARK
    // over C2S_ClientInput.input_number, not "the last input that moved you".
    // A number, not an input: it is what trims the client's resend tail and
    // where its reconciliation replay starts.
    optional int32 latest_processed_input_number = 6;

    // A package is exactly ONE of two kinds, and this field's PRESENCE is which:
    //
    //   absent  -- FULL UPDATE. Every networked leaf is on the wire; the
    //              receiver needs no baseline and decodes it standalone.
    //   present -- DELTA against this tick. The receiver must still hold its
    //              reconstructed snapshot for it, or the packet is undecodable
    //              and must be dropped whole -- applying a delta to the wrong
    //              baseline is worse than missing a frame.
    //
    // Presence, not a sentinel value: there is no tick number that means "not a
    // delta", so the field never carries two meanings at once. Both ends go
    // through set_snapshot_baseline / snapshot_baseline_tick
    // (network/entity_snapshot.hpp) so neither open-codes that.
    optional uint32 delta_from_tick = 7;

    // THE MATCH-LEVEL STATE, replicated as STATE rather than delivered as an
    // event, and the distinction is load-bearing.
    //
    // The client PREDICTS against the phase (shared/round_phase_rules.hpp): the
    // Countdown freeze suppresses movement, so a client that does not know it is
    // frozen predicts seconds of walking the server discards. A phase that
    // arrived only as a reliable event would be a round trip behind the
    // snapshots describing the world it governs -- the two channels are on
    // different clocks, and a snapshot never waits.
    //
    // So the phase is IN the snapshot, which is what makes the skew
    // unrepresentable rather than merely small: the gate reads state that
    // self-heals every tick, and Round_Phase_Changed goes back to being purely
    // the banner occurrence it should always have been. Same rule as
    // held_snapshot_tick in the other direction -- state that gates behavior is
    // replicated as state, never delivered as an event.
    //
    // Not an entity, so not in entity_data: this is per-tick SERVER state, and
    // the client's session is reconstructed from entities alone.
    //
    // phase is shared::Round_Phase, whose enum lives in events.def because the
    // banner event carries it too. A value the client's build does not know is
    // out of range and the client keeps the phase it had -- SCHEMA_HASH already
    // refuses a build that could disagree, so this is belt and braces.
    optional uint32 round_phase    = 8;
    optional uint32 phase_end_tick = 9;  // server tick; 0 = ends on a win condition
    optional uint32 round_number   = 10; // 1-based; 0 before the first round
}

// --------------------------------------------- things that are uncertain


// I think most of this is deprecated.
//
// NOTE: entity_id fields in CmdSpawn/CmdMove (int32) and EntityState (uint64)
// below are legacy. The live wire path is S2C_EntityPackage.entity_data, a
// Bit_Writer-encoded bitstream where entity_uid_t rides as var-int uint32 —
// see src/shared/entity_uid.hpp. If any of these legacy messages are revived,
// align their entity_id type to uint32 to match.

message Player {
  string name = 1;
  int32 id = 2;
  float score = 3;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

enum EntityType {
  UNKNOWN = 0;
  PLAYER = 1;
  WEAPON = 2;
}

message CmdSpawn {
  int32 entity_id = 1;
  int32 type_id = 2;
  Vec3 position = 3;
}



message CmdMove {
  int32 entity_id = 1;
  Vec3 target_position = 2;
}

message GameTick {
  uint32 tick_id = 1;
  repeated CmdSpawn spawns = 2;
  repeated CmdMove moves = 3;
}

message Replay {
  string server_name = 1;
  int64 timestamp = 2;
  repeated GameTick ticks = 3;
  uint64 seed = 4;
}

message EntityState {
  uint64 entity_id = 1;
  Vec3 position = 2;
  Vec3 velocity = 3;
  // Add other components here as optional fields
}

message Snapshot {
  uint32 tick_id = 1;
  uint32 delta_from_tick_id = 2; // 0 = Full Snapshot
  repeated EntityState entities = 3;
  uint64 rng_state = 4;
}

message AABB {
  Vec3 center = 1;
  Vec3 half_extents = 2;
}

message EntitySpawn {
  EntityType type = 1;
  Vec3 position = 2;
  float yaw = 3;
}

message MapSource {
  repeated AABB aabbs = 1;
  string name = 2;
  repeated EntitySpawn entities = 3;
}

// --------------------------------------------- Network Negotiation

message CmdConnect {
    int32 protocol_version = 1;
    string player_name = 2;
    uint32 schema_hash = 3;     // entities::SCHEMA_HASH -- digest of every
                                // declaration in entities.def plus the resolved
                                // asset manifest. The server refuses a client
                                // whose hash differs: the two builds disagree
                                // about entity layout, so every snapshot after
                                // the handshake would be misparsed.
}

message CmdAccept {
    int32 client_slot = 1;
    string map_name = 2;        // Logical map name (worldspawn "name"), for display.
    int32 server_tickrate = 3;
    string map_path = 4;        // Loadable path/identifier the server loaded from.
                                // TODO(map-stream): replace absolute path with a
                                // maps-relative id once byte streaming lands; the
                                // hash below already makes the path advisory, not trusted.
    uint32 content_hash = 5;    // FNV-1a of the map file bytes. Client verifies its
                                // locally-loaded map matches; mismatch = hard error
                                // until S2C_MapData streaming exists.
}

message CmdReject {
    string reason = 1;
    uint32 server_schema_hash = 2;  // Only set when the rejection IS a schema
                                    // mismatch, so the client can log both
                                    // sides. 0 for every other reason.
}

message CmdDisconnect {
    string reason = 1;
}

message NetCommand {
    // Oneof ensures only one payload is set
    oneof command {
        CmdConnect connect = 2;
        CmdAccept accept = 3;
        CmdReject reject = 4;
        CmdDisconnect disconnect = 5;
    }
}

// Client → Server: a console command line (e.g. "spawn_bot")
message C2S_Command {
    string line = 1;
}

// Server → Client: a text message to display in the client console
message S2C_ServerMessage {
    string message = 1;
}

// CvarPair / S2C_CVarSync lived here. They shipped every cvar NAME, description
// and flag so the client could build stub registry entries for autocomplete and
// forwarding. Both sides now compile the same generated tables out of cvars.def
// and the handshake refuses a client whose SCHEMA_HASH differs, so names need no
// message at all; @Mirrored VALUES ride S2C_CvarValues, which is
// bitstream-native (src/shared/network/cvar_mirror.hpp).

// Server → Client: bot debug state sent every tick
message BotDebugEntry {
    int32 slot       = 1;
    int32 goal       = 2; // BotGoal: 0=Idle 1=Chase 2=Attack 3=Retreat
    int32 type       = 3; // bot_behavior_t: 0=Idle 1=Chase 2=Regular
    repeated Vec3 path = 4;
    int32 path_index = 5;
}

message S2C_BotDebug {
    repeated BotDebugEntry bots = 1;
}

// Server -> Client: everything the server used to judge ONE shot, sent only to
// the shooter and only while sv_shot_debug is on.
//
// This exists because the client cannot reconstruct any of it. It does not know
// which bracket the server accepted, whether the rewind was clamped or refused,
// or what the snapshot ring held -- so a client that redrew "where the server
// probably tested" would be auditing its own guess. The disagreement is only
// meaningful if this side of it arrives over the wire.
//
// POSES, not volumes. compute_player_hitboxes is one shared function and the
// three sv_aim_* extents it reads are @Mirrored, so posing a pose reproduces the
// volumes exactly -- at 16 bytes per target instead of a whole volume set. What
// is genuinely the server's answer is the POSE (the rewind's output); turning it
// into volumes is arithmetic both sides already agree on.
message ShotDebugTarget {
    uint32 player_uid    = 1;
    Vec3   feet_position = 2;
    float  body_yaw      = 3;
    float  view_yaw      = 4;
    float  view_pitch    = 5;
}

message S2C_ShotDebug {
    // The key the client pairs its own stash against. Client input numbers are
    // the one sequence both ends already agree on, and a shot is identified by
    // the input that fired it.
    uint32 input_number = 1;
    uint32 server_tick  = 2;
    // Which sub-tick slot the trigger went down in (shared/subtick.hpp).
    uint32 fire_slot    = 3;

    // The ray as the server took it: post-move eye, along the aim in effect at
    // the step the press opened.
    Vec3 eye       = 4;
    Vec3 direction = 5;

    // bracket_status_t: 0=Ok 1=Clamped 2=Absent 3=Malformed 4=Unheld. Anything
    // but Ok/Clamped means NO REWIND HAPPENED and the targets below are
    // present-tick -- which is the single most common reason a dead-on shot
    // misses, and is invisible without this field.
    uint32 bracket_status = 6;
    bool   used_rewind    = 7;

    uint32 requested_from_tick    = 8;
    uint32 requested_towards_tick = 9;
    float  requested_fraction     = 10;
    uint32 used_from_tick         = 11;
    uint32 used_towards_tick      = 12;
    float  used_fraction          = 13;

    // Every target the hitscan actually ranked, posed as the server posed them.
    repeated ShotDebugTarget targets = 14;

    // 0 = miss. On a miss, nearest_miss_distance is how far the ray passed from
    // the closest target's bounding sphere -- 3 units is a pose problem, 200 is
    // a rewind that never happened.
    uint32 hit_uid               = 15;
    uint32 hit_region            = 16;
    Vec3   impact_point          = 17;
    float  nearest_miss_distance = 18;
}

// Server → Client: a batch of reliable gameplay events produced this tick.
// The payload is the packed shared::game_event_t batch format
// ([count:u16][kind:u16][packed payload]…), encoded via Bit_Writer. Reliable
// channel by design (kill feed entries can't silently drop); ack/retransmit
// is a follow-up if/when packet loss causes visible gaps.
message S2C_GameEventBatch {
    optional bytes event_data  = 1;
    optional uint32 server_tick = 2;
}

// Server -> Client: a batch of cosmetic effects produced this tick. Same
// payload shape as S2C_GameEventBatch -- the two channels differ in intended
// reliability, not in encoding.
//
// This used to be spliced into S2C_EntityPackage.entity_data behind a
// byte-align, which coupled two files that had to be edited together and
// decoded as plausible garbage when they were not. It also put a burst of
// cosmetics on the critical path of the entity delta: crossing 1200 bytes
// fragments the packet, and losing one fragment of an unreliable message costs
// the whole snapshot. A cosmetic can now only cost cosmetics.
message S2C_EffectBatch {
    optional bytes effect_data  = 1;
    optional uint32 server_tick = 2;
}
